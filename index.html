<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b2420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shop Worker</title>
<style>
  /* Same look as Shop Hub (HubPage.html), so both portals feel like one system. */
  :root{--bg:#f6f3ee;--panel:#fff;--ink:#2b2420;--muted:#7a6f66;--line:#e6dfd5;--wood:#8a5a35;--wood-soft:#f1e6da;
    --green:#2f6b4f;--green-soft:#e3efe8;--amber:#b7791f;--amber-soft:#fbf0dc;--red:#b03a2e;--red-soft:#f8e3e0}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  aside{background:#2b2420;color:#efe7dd;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
  .brand{font-weight:700;font-size:16px;padding:0 10px 18px}.brand small{display:block;font-weight:400;color:#b9ab9c;font-size:12px}
  nav{display:flex;flex-direction:column;gap:4px}
  nav button{all:unset;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;color:#e3d8cb;white-space:nowrap}
  nav button:hover{background:#3a312b} nav button.on{background:var(--wood);color:#fff}
  .ico{width:18px;text-align:center}
  main{padding:22px 30px;min-width:0;max-width:900px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  h1{font-size:22px;margin:0} h2{font-size:15px;margin:0 0 10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .big{font-size:26px;font-weight:700}.note{font-size:13px;color:var(--muted)}
  .btn{all:unset;cursor:pointer;padding:12px 18px;border-radius:9px;font-weight:600;font-size:15px;text-align:center}
  .btn-p{background:var(--wood);color:#fff}.btn-s{background:var(--wood-soft);color:var(--wood)}
  .btn-g{background:var(--green);color:#fff}.btn-r{background:var(--red-soft);color:var(--red)}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .ops .btn{padding:18px 12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .ops .btn:hover{border-color:var(--wood)} .ops .btn.cnc{background:var(--wood-soft);color:var(--wood)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .c-green{background:var(--green-soft);color:var(--green)}.c-amber{background:var(--amber-soft);color:var(--amber)}.c-wood{background:var(--wood-soft);color:var(--wood)}
  .c-red{background:var(--red-soft);color:var(--red)}.c-grey{background:#eee8e1;color:var(--muted)}
  .now{border-color:var(--green);background:var(--green-soft)}
  .empty{color:var(--muted);padding:8px 0}
  .steps{padding-left:20px;margin:0}.steps li{margin-bottom:8px}
  .view{display:none}.view.on{display:block}
  #toast{position:fixed;right:18px;bottom:18px;left:auto;background:#2b2420;color:#fff;padding:12px 16px;border-radius:8px;display:none;max-width:420px;z-index:9}
  #toast.err{background:var(--red)}
  #busy{position:fixed;inset:0;background:rgba(246,243,238,.6);display:none;place-items:center;z-index:8;font-weight:600}
  #modal{position:fixed;inset:0;background:rgba(43,36,32,.45);display:none;z-index:10;padding:0 14px}
  #pops{position:fixed;right:14px;top:14px;z-index:13;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100% - 28px))}
  .pop{background:#fff;border:1px solid var(--line);border-left:4px solid var(--wood);border-radius:10px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .tour-on{position:relative;z-index:11;box-shadow:0 0 0 4px var(--amber),0 0 0 9999px rgba(43,36,32,.45);border-radius:10px}
  #tourbox{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(440px,calc(100% - 28px));background:#fff;border-radius:12px;padding:16px;z-index:12;display:none;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  @media (max-width:760px){
    .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr} aside{padding:12px 10px 8px;position:sticky;top:0;z-index:5;min-width:0}
    .brand{padding:0 6px 8px} nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
    nav button{padding:9px 12px;background:#3a312b} main{padding:14px} #toast{left:12px;right:12px}
  }
</style>
</head>
<body>
<div id="busy">Working…</div>
<div id="toast"></div>
<div class="app">
  <aside>
    <div class="brand">The Wooden Legacy<small id="who">Shop Worker</small></div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>

<script>
// V91: this page lives on its own address and talks to the Shop Worker Apps Script as an API (no Google sign-in needed).
var API = "https://script.google.com/macros/s/AKfycbwSfMKRKSkvT3t7yJ7Ho2ExvUUcsXemMnavziDjfeaSg84TMki2E3ulvnlvSV4-gmGVog/exec";
var TOKEN = new URLSearchParams(location.search).get("t") || "", S = null, VIEW = "My day", TABS = [];
try { if (TOKEN) localStorage.setItem("shopWorkerToken", TOKEN); else TOKEN = localStorage.getItem("shopWorkerToken") || ""; } catch (e) {}
var ICONS = { "Tasks": "☑", "My day": "▦", "General": "⚑", "Blanks": "▤", "Batches": "▤", "CNC": "◈", "Hand work": "✋", "Parts": "▣", "Kitchens": "⌂", "Jobs": "☰", "Stock check": "✓", "Help": "?" };
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function hm(m){ m = Math.max(0, Math.round(m || 0)); return (m >= 60 ? Math.floor(m / 60) + " h " : "") + (m % 60) + " min"; }
function toast(t, err){ var x = $("toast"); x.textContent = t; x.className = err ? "err" : ""; x.style.display = "block"; clearTimeout(x._h); x._h = setTimeout(function(){ x.style.display = "none"; }, err ? 7000 : 3000); }
var ACTIONS = { wkState: ["state"], wkClockIn: ["clockIn"], wkClockOut: ["clockOut"], wkStart: ["start", "a", "o", "i"], wkPause: ["pause"],
                wkContinue: ["continue", "id"], wkDone: ["done", "id"], wkMachineStop: ["machineStop", "id"],
                wkMapStart: ["mapStart", "order", "tier", "design"], wkMapDone: ["mapDone", "id", "q", "note", "photo"],  // V92
                wkBatchStart: ["batchStart", "out"], wkBatchTake: ["batchTake", "id", "item", "qty"],
                wkBatchFinish: ["batchFinish", "id", "qty", "def", "leftItem", "leftQty"], wkCount: ["count", "c"],
                wkFile: ["file", "id"], wkReport: ["report", "job", "type", "qty", "note", "photo"],  // V93
                wkTaskStart: ["taskStart", "id"], wkTaskCheck: ["taskCheck", "id", "n", "on"], wkTaskWait: ["taskWait", "id", "why"], wkTaskDone: ["taskDone", "id"] };  // V94
function api(fn, args){
  if (DEMO) return new Promise(function(ok){ ok(sim(fn, args)); });  // V94: training mirror - nothing is sent
  var a = ACTIONS[fn], q = "?api=" + a[0] + "&t=" + encodeURIComponent(TOKEN);
  for (var i = 1; i < a.length; i++) q += "&" + a[i] + "=" + encodeURIComponent(args[i - 1] == null ? "" : args[i - 1]);
  return fetch(API + q, { credentials: "omit", cache: "no-store" }).then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) throw new Error(j.error); return j.state; });
}
function call(fn){
  var args = [].slice.call(arguments, 1);
  $("busy").style.display = "grid";
  return api(fn, args).then(function(s){ $("busy").style.display = "none"; S = s; render(); return s; }, function(e){
    $("busy").style.display = "none";
    if (/not valid/i.test(e.message)) { try { localStorage.removeItem("shopWorkerToken"); } catch (x) {} noLink(e.message); }
    else toast(/fetch|network/i.test(e.message) ? "No connection - check the internet and try again." : e.message, true);
    throw e;
  });
}
function noLink(msg){ $("nav").innerHTML = ""; $("main").innerHTML = '<div class="card"><div class="big">Open your personal link</div><div class="note">' + esc(msg || "This page needs the link the office sent you.") + ' Ask the office for a new link if it does not work.</div>' +
  '<div class="actions"><button class="btn btn-s" onclick="location.search=\'?demo=1\'">Practise in training mode</button></div></div>'; }
function areas(){ var a = []; S.ops.forEach(function(o){ if (a.indexOf(o.area) < 0) a.push(o.area); }); return a; }
function go(v){ VIEW = v; render(); window.scrollTo(0, 0); }

function render(){
  $("who").textContent = DEMO ? "TRAINING · nothing is saved" : S.name + (S.shift ? " · on shift" : "");
  var tabs = TABS = ["My day"].concat(S.tasks ? ["Tasks"] : [], areas(), S.cnc ? ["Stock check"] : [], ["Help"]);  // V94: Tasks
  if (tabs.indexOf(VIEW) < 0) VIEW = "My day";
  $("nav").innerHTML = tabs.map(function(t, i){ return '<button class="' + (t === VIEW ? "on" : "") + '" onclick="go(TABS[' + i + '])"><span class="ico">' + (ICONS[t] || "•") + '</span>' + esc(t) + '</button>'; }).join("");
  $("main").innerHTML = VIEW === "My day" ? myDay() : VIEW === "Help" ? help() : VIEW === "Stock check" ? stockCheck() : VIEW === "Tasks" ? tasksView() : area(VIEW);
  var hd = $("main").querySelector("header");  // V94: "?" on every screen
  if (hd && VIEW !== "Help") hd.insertAdjacentHTML("beforeend", '<button class="btn btn-s" id="qbtn" style="padding:8px 15px" title="Help for this screen" onclick="tip()">?</button>');
  if (TI >= 0) tourMark();
}

function runningCard(){
  if (!S.running) return "";
  var r = S.running;
  return '<div class="card now"><div class="note">Working now · ' + esc(r.area) + '</div><div class="big">' + esc(r.op) + '</div>' +
    '<div class="note">' + hm(r.minutes) + ' so far · started ' + esc(r.started) + (r.items ? ' · ' + esc(r.items.replace(/job:([^;]+)/g, function(x, k){ return kitName(k); }).replace(/task:([^;]+)/g, function(x, k){ return taskName(k); }).replace(/map:/g, "#").replace(/batch:/g, "").replace(/;/g, ", ")) : "") + '</div>' +
    '<div class="actions"><button class="btn btn-s" onclick="call(\'wkPause\')">Pause</button><button class="btn btn-g" onclick="call(\'wkDone\',\'' + r.opId + '\')">Done</button></div></div>';
}
function machineCards(){
  return S.machine.map(function(m){
    return '<div class="card"><div class="note">CNC machine</div><div class="big">' + esc(m.op) + '</div>' +
      '<div class="note">Running ' + hm(m.minutes) + ' · since ' + esc(m.since) + '</div>' +
      '<div class="actions"><button class="btn btn-p" onclick="call(\'wkMachineStop\',\'' + m.opId + '\')">Cut finished</button></div></div>';
  }).join("");
}
function myDay(){
  var h = '<header><h1>My day</h1><div class="note">' + new Date().toLocaleDateString("en-CA", { weekday: "long", month: "long", day: "numeric" }) + '</div></header>';
  h += S.shift
    ? '<div class="card"><div class="note">On shift since ' + esc(S.shift.since) + '</div><div class="big">' + hm(S.shift.minutes) + '</div><div class="actions"><button class="btn btn-r" onclick="clockOut()">Clock out</button></div></div>'
    : '<div class="card"><div class="big">Not clocked in</div><div class="note">Press Clock in when you start work.</div><div class="actions"><button class="btn btn-g" onclick="call(\'wkClockIn\')">Clock in</button></div></div>';
  h += runningCard() + machineCards();
  var tl = S.tasks || [], to = tl.filter(function(t){ return t.overdue; }).length;  // V94: tasks waiting for the worker
  if (tl.length) h += '<div class="card"><div class="row" style="padding:0"><div><b>' + tl.length + ' task' + (tl.length > 1 ? "s" : "") + ' for you</b>' + (to ? ' <span class="chip c-red">' + to + ' overdue</span>' : "") +
    '<div class="note">' + esc(tl[0].title) + (tl.length > 1 ? " and more" : "") + '</div></div><button class="btn btn-s" onclick="go(\'Tasks\')">Open</button></div></div>';
  if (S.paused.length) h += '<div class="card"><h2>Paused / drying</h2>' + S.paused.map(function(p){
    return '<div class="row"><div><b>' + esc(p.op) + '</b> <span class="chip c-amber">' + esc(p.area) + '</span><div class="note">' + hm(p.minutes) + ' of work · paused ' + esc(p.since) + '</div></div>' +
      '<div class="actions" style="margin:0"><button class="btn btn-s"' + (S.shift ? "" : " disabled") + ' onclick="call(\'wkContinue\',\'' + p.opId + '\')">Continue</button><button class="btn btn-g" onclick="call(\'wkDone\',\'' + p.opId + '\')">Done</button></div></div>'; }).join("") + '</div>';
  if (S.shift && !S.running) h += '<div class="card"><h2>What are you doing now?</h2><div class="ops">' + areas().map(function(a){ return '<button class="btn" onclick="go(TABS[' + TABS.indexOf(a) + '])">' + (ICONS[a] || "•") + ' ' + esc(a) + '</button>'; }).join("") + '</div></div>';
  h += '<div class="card"><h2>Today</h2>' + (S.today.length ? S.today.map(function(t){
    return '<div class="row"><div>' + esc(t.op) + ' <span class="note">· ' + esc(t.area) + (t.kind === "machine" ? " · machine" : "") + '</span></div><div class="note">' + esc(t.from) + '–' + esc(t.to || "now") + ' · ' + hm(t.minutes) + '</div></div>'; }).join("") : '<div class="empty">Nothing yet today.</div>') + '</div>';
  return h;
}
// ---------- V92: CNC maps - maps and batches on the tabs
var SELM = {}, SELB = "", FIN = "", PHOTO = null;
function opLinks(list){ var s = {}; list.forEach(function(o){ s[o.links] = 1; }); return s; }
function mapLabel(m){ return "#" + m.serial + " " + m.tier + (m.design ? " · " + m.design : ""); }
function area(a){
  var list = S.ops.filter(function(o){ return o.area === a; }), L = opLinks(list), c = S.cnc;
  var h = '<header><h1>' + esc(a) + '</h1></header>';
  if (!S.shift) h += '<div class="card"><b>Clock in first</b><div class="note">Go to My day and press Clock in.</div><div class="actions"><button class="btn btn-g" onclick="call(\'wkClockIn\')">Clock in</button></div></div>';
  if (S.running && S.running.area === a) h += runningCard();
  if (list.some(function(o){ return o.kind === "machine"; })) h += machineCards();
  if (c && (L.map || L.any)) h += mapsCard();
  if (c && (L.batch || L.any)) h += batchesCard(a);
  if (L.job) h += kitchensCard(a);  // V93; V94: Kitchens tab = kitchens, Jobs tab = construction jobs
  h += '<div class="card"><h2>Start an operation</h2><div class="ops">' + list.map(function(o){
    var busy = o.kind === "machine" && S.machine.length;
    return '<button class="btn' + (o.kind === "machine" ? " cnc" : "") + '"' + (S.shift && !busy ? "" : " disabled") + ' onclick="start(' + S.ops.indexOf(o) + ')">' +
      (o.kind === "machine" ? "▶ Start: " : "") + esc(o.op) + '</button>'; }).join("") + '</div>' +
    '<div class="note" style="margin-top:10px">' + (L.job ? "Choose the " + (a === "Kitchens" ? "kitchen" : "job") + " above, then press the operation. " : L.map || L.batch || L.any ? "Tick the map(s) or choose the batch above, then press the operation. " : "") +
    'Starting a new operation finishes the one you are doing now. The CNC runs on its own - start the cut, then do hand work.</div></div>';
  return h;
}
function mapsCard(){
  var c = S.cnc, h = '<div class="card"><h2>Maps in progress</h2>';
  h += c.maps.length ? c.maps.map(function(m){
    var fin = FIN === m.serial;
    return '<div class="row"><label style="display:flex;gap:10px;align-items:center;font-size:15px"><input type="checkbox" style="width:22px;height:22px"' + (SELM[m.serial] ? " checked" : "") +
      ' onchange="SELM[\'' + m.serial + '\']=this.checked"> <span><b>' + esc(mapLabel(m)) + '</b><div class="note">' + esc(m.worker) + ' · started ' + esc(m.started) + '</div></span></label>' +
      '<button class="btn btn-s" onclick="FIN=FIN===\'' + m.serial + '\'?\'\':\'' + m.serial + '\';PHOTO=null;render()">' + (fin ? "Close" : "Finish map") + '</button></div>' + (fin ? finishForm(m) : ""); }).join("")
    : '<div class="empty">No maps in progress.</div>';
  h += '<h2 style="margin-top:14px">Start a new map</h2>';
  if (c.orders.length) h += '<div class="ops">' + c.orders.map(function(o, i){ return '<button class="btn"' + (S.shift ? "" : " disabled") + ' onclick="mapStart(' + i + ')">' + esc(o.tier) + (o.design ? " · " + esc(o.design) : "") + (o.due ? '<div class="note">due ' + esc(o.due) + '</div>' : "") + '</button>'; }).join("") + '</div><div class="note" style="margin:8px 0">Orders first. Or make one for stock:</div>';
  h += '<div class="actions" style="margin-top:6px"><select id="nmTier" style="max-width:200px;padding:10px">' + c.tiers.map(function(t){ return '<option>' + esc(t.tier) + '</option>'; }).join("") + '</select>' +
    '<input id="nmDesign" placeholder="Place / design (optional)" style="max-width:240px;padding:10px"><button class="btn btn-p"' + (S.shift ? "" : " disabled") + ' onclick="mapStart(-1)">Start map</button></div>';
  return h + '</div>';
}
function finishForm(m){
  return '<div style="background:var(--wood-soft);border-radius:10px;padding:12px;margin:6px 0 10px">' +
    '<label class="note">1. Photo of the finished map</label><input type="file" accept="image/*" capture="environment" onchange="pickPhoto(this)" style="margin:6px 0 10px">' +
    '<label class="note">2. Quality</label><div class="actions" style="margin:6px 0 10px"><label><input type="radio" name="fq" value="ok" checked> OK</label><label><input type="radio" name="fq" value="defect"> Defect</label></div>' +
    '<label class="note">3. Note (what went wrong, if a defect)</label><input id="fNote" style="width:100%;padding:10px;margin:6px 0 10px">' +
    '<button class="btn btn-g" onclick="mapDone(\'' + m.serial + '\')">Map #' + esc(m.serial) + ' is done</button></div>';
}
function batchesCard(a){
  var c = S.cnc, take = c.stock.filter(function(s){ return s.kind !== "made"; });
  var made = c.stock.filter(function(s){ return s.kind === "made" && (a === "Blanks" ? /^blank/i.test(s.item) : a === "Parts" ? !/^blank/i.test(s.item) : true); });
  var low = made.filter(function(s){ return s.low; });
  var h = '<div class="card"><h2>Batches</h2>';
  if (low.length) h += '<div class="note" style="color:var(--amber);margin-bottom:8px">Needed: ' + low.map(function(s){ return esc(s.item) + " (" + s.stock + " left, min " + s.min + ")"; }).join(", ") + '</div>';
  h += c.batches.length ? c.batches.map(function(b){
    var on = SELB === b.id;
    return '<div class="row" style="flex-wrap:wrap"><label style="display:flex;gap:10px;align-items:center;font-size:15px"><input type="radio" name="selb" style="width:22px;height:22px"' + (on ? " checked" : "") +
      ' onchange="SELB=\'' + b.id + '\';render()"> <span><b>' + esc(b.output) + '</b><div class="note">' + esc(b.id) + ' · ' + esc(b.worker) + (b.inputs ? ' · took ' + esc(b.inputs) : " · nothing taken yet") + '</div></span></label></div>' +
      (on ? batchForms(b, take) : ""); }).join("")
    : '<div class="empty">No open batches.</div>';
  h += '<h2 style="margin-top:14px">New batch</h2><div class="actions"><select id="nbOut" style="max-width:260px;padding:10px">' + made.map(function(s){ return '<option>' + esc(s.item) + '</option>'; }).join("") +
    '</select><button class="btn btn-p"' + (S.shift ? "" : " disabled") + ' onclick="batchStart()">Start batch</button></div>';
  return h + '</div>';
}
function batchForms(b, take){
  var opts = take.map(function(s){ return '<option value="' + esc(s.item) + '">' + esc(s.item) + ' (' + esc(s.unit) + ')</option>'; }).join("");
  return '<div style="background:var(--wood-soft);border-radius:10px;padding:12px;margin:6px 0 10px;width:100%">' +
    '<label class="note">Take material (a board: length in feet)</label><div class="actions" style="margin:6px 0 12px"><select id="btItem" style="max-width:220px;padding:10px">' + opts + '</select>' +
    '<input id="btQty" type="number" step="0.1" placeholder="8" style="max-width:90px;padding:10px"><button class="btn btn-s" onclick="batchTake()">Take</button></div>' +
    '<label class="note">Finish the batch</label><div class="actions" style="margin:6px 0 0"><input id="bfQty" type="number" placeholder="Good pieces" style="max-width:130px;padding:10px">' +
    '<input id="bfDef" type="number" placeholder="Defects" style="max-width:100px;padding:10px"></div>' +
    '<div class="actions" style="margin:6px 0 0"><select id="bfLeftItem" style="max-width:220px;padding:10px"><option value="">No leftover</option>' + opts + '</select>' +
    '<input id="bfLeftQty" type="number" step="0.1" placeholder="Leftover" style="max-width:100px;padding:10px"><button class="btn btn-g" onclick="batchFinish()">Batch done</button></div></div>';
}
function selItems(o){
  var maps = Object.keys(SELM).filter(function(k){ return SELM[k] && S.cnc && S.cnc.maps.some(function(m){ return m.serial === k; }); }).map(function(k){ return "map:" + k; });
  var batch = SELB && S.cnc && S.cnc.batches.some(function(b){ return b.id === SELB; }) ? ["batch:" + SELB] : [];
  if (o.links === "map") return maps.join(";");
  if (o.links === "batch") return batch.join(";");
  if (o.links === "any") return (maps.length ? maps : batch).join(";");
  if (o.links === "job") return SELK && kitName(SELK) !== SELK ? "job:" + SELK : "";  // V93
  return "";
}
function mapStart(i){
  var c = S.cnc, args = i >= 0 ? [c.orders[i].id, "", ""] : ["", $("nmTier").value, $("nmDesign").value];

      c.batches = c.batches.filter(function(x){ return x !== f; }); simClose(function(g){ return hand(g) && g.items === "batch:" + a[0]; }, "done");
      break;
    case "wkCount": String(a[0] || "").split(";").forEach(function(s){ var q = s.split("|"); c.stock.forEach(function(x){ if (x.item === q[0]) { x.stock = Number(q[1]); x.low = x.stock < x.min; } }); }); break;
    case "wkReport":
      if (a[1] === "Sheets used" && !(Number(a[2]) > 0)) throw new Error("Enter how many sheets.");
      if (a[1] !== "Sheets used" && !String(a[3]).trim()) throw new Error("Write what happened.");
      break;
    case "wkFile": throw new Error("Training mode: files do not open here. At work this button opens the drawing.");
    case "wkTaskStart":
      need();
      var t = simTask(a[0]); simClose(hand, "next");
      SIM.segs.push({ opId: "t" + t.id, area: "Tasks", op: t.title, kind: "hand", items: "task:" + t.id, start: Date.now(), end: 0, reason: "" }); t.status = "In progress"; t.reason = "";
      break;
    case "wkTaskCheck": simTask(a[0]).steps[Number(a[1])].done = String(a[2]) === "1"; break;
    case "wkTaskWait":
      if (!String(a[1]).trim()) throw new Error("Write what you are waiting for.");
      simClose(function(g){ return g.items === "task:" + a[0]; }, "next"); simTask(a[0]).status = "Waiting"; simTask(a[0]).reason = a[1];
      break;
    case "wkTaskDone": simClose(function(g){ return g.items === "task:" + a[0]; }, "done"); simTask(a[0]).status = "Done"; break;
  }
  return simState();
}
// ---------- V94: Tasks tab - tasks from the office (priority, due date, steps, Waiting with the reason)
var TWAIT = "";
function taskName(id){ var t = (S.tasks || []).filter(function(x){ return x.id === id; })[0]; return t ? t.title : "task"; }
function tasksView(){
  var list = S.tasks || [], h = '<header><h1>Tasks</h1><div class="note">' + list.length + ' open</div></header>';
  if (!list.length) return h + '<div class="card"><div class="empty">No tasks for you right now. The office adds them in Shop Hub.</div></div>';
  return h + list.map(function(t, i){
    var on = S.running && S.running.items === "task:" + t.id, pc = { High: "c-red", Normal: "c-wood", Low: "c-grey" }[t.priority] || "c-wood";
    var st = t.status === "Waiting" ? '<span class="chip c-amber">Waiting: ' + esc(t.reason) + '</span>' : t.status === "In progress" ? '<span class="chip c-green">In progress</span>' : "";
    return '<div class="card' + (on ? " now" : "") + '"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b style="font-size:17px">' + esc(t.title) + '</b>' +
      '<span><span class="chip ' + pc + '">' + esc(t.priority) + '</span> ' + (t.due ? '<span class="chip ' + (t.overdue ? "c-red" : "c-grey") + '">' + (t.overdue ? "Overdue · " : "Due ") + esc(t.due) + '</span>' : "") + '</span></div>' +
      '<div class="note" style="margin:4px 0 8px">' + (t.job ? esc(t.job) + ' · ' : "") + (t.minutes ? hm(t.minutes) + ' of work ' : "") + st + '</div>' +
      (t.instructions ? '<div style="white-space:pre-wrap;margin-bottom:8px">' + esc(t.instructions) + '</div>' : "") +
      t.steps.map(function(s, k){ return '<label style="display:flex;gap:10px;align-items:center;padding:6px 0"><input type="checkbox" style="width:22px;height:22px"' + (s.done ? " checked" : "") +
        ' onchange="call(\'wkTaskCheck\',S.tasks[' + i + '].id,' + k + ',this.checked?1:0)"> <span' + (s.done ? ' style="text-decoration:line-through;color:var(--muted)"' : "") + '>' + esc(s.text) + '</span></label>'; }).join("") +
      (TWAIT === t.id ? '<div class="actions"><input id="twWhy" placeholder="What are you waiting for?" style="flex:1;min-width:200px;padding:10px"><button class="btn btn-p" onclick="taskWait(' + i + ')">Send</button><button class="btn btn-s" onclick="TWAIT=\'\';render()">Close</button></div>' :
        '<div class="actions">' + (on ? "" : '<button class="btn btn-p"' + (S.shift ? "" : " disabled") + ' onclick="call(\'wkTaskStart\',S.tasks[' + i + '].id).then(function(){ toast(\'Started: \' + S.running.op); })">Start</button>') +
        '<button class="btn btn-s" onclick="TWAIT=S.tasks[' + i + '].id;render()">Waiting…</button>' +
        '<button class="btn btn-g" onclick="call(\'wkTaskDone\',S.tasks[' + i + '].id).then(function(){ toast(\'Task done\'); })">Done</button></div>') + '</div>';
  }).join("");
}
function taskWait(i){ call("wkTaskWait", S.tasks[i].id, $("twWhy").value).then(function(){ TWAIT = ""; render(); toast("The office will see it"); }); }
function start(i){ var o = S.ops[i]; call("wkStart", o.area, o.op, selItems(o)).then(function(){ toast("Started: " + o.op); }); }
function clockOut(){ call("wkClockOut").then(function(){ toast("Clocked out. Anything running is paused until tomorrow."); }); }

// The page is the worker's clock: minutes move every 30 s, fresh data every 2 minutes.
function tick(){
  if (!S) return;
  if (S.shift) S.shift.minutes += 0.5;
  if (S.running) S.running.minutes += 0.5;
  S.machine.forEach(function(m){ m.minutes += 0.5; });
  if (VIEW === "My day") render();  // V92: other tabs hold forms - no re-render under the fingers
}
// V95: every 2 minutes on every tab - a pop-up when the office gives a new task
var n = 0, KNOWN = null;
function pop(text, view){
  var box = $("pops");
  if (!box) { box = document.createElement("div"); box.id = "pops"; document.body.appendChild(box); }
  var p = document.createElement("div"); p.className = "pop";
  p.innerHTML = '<div style="display:flex;justify-content:space-between;gap:8px"><b>' + esc(text) + '</b><span style="cursor:pointer" onclick="this.closest(\'.pop\').remove()">×</span></div>' +
    (view ? '<div class="actions" style="margin-top:8px"><button class="btn btn-p" onclick="go(\'' + view + '\');this.closest(\'.pop\').remove()">Open</button></div>' : "");
  box.appendChild(p);
  setTimeout(function(){ if (p.parentNode) p.remove(); }, 120000);
}
function newTasks(s){
  var list = s.tasks || [];
  if (KNOWN) list.forEach(function(t){ if (KNOWN.indexOf(t.id) < 0) pop("New task from the office: " + t.title, "Tasks"); });
  KNOWN = list.map(function(t){ return t.id; });
}
setInterval(function(){ n++; tick(); if (n % 4 === 0) api("wkState", []).then(function(s){ newTasks(s); if (VIEW === "My day" || (VIEW === "Tasks" && !TWAIT)) { S = s; render(); } }, function(){}); }, 30000);
if (DEMO) { simInit(); call("wkState").then(function(s){ newTasks(s); tourFirst(); }); }  // V94: training mirror
else if (TOKEN) call("wkState").then(function(s){ newTasks(s); tourFirst(); }, function(){}); else noLink();  // V95: remember the tasks for pop-ups
</script>
